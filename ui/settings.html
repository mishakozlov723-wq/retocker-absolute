<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Retocker Absolute</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css"><link rel="stylesheet" href="settings.css">

<div class="app">
  <div class="tbar">

    <button class="wb" data-w="min" title="Свернуть"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>

    <button class="ni" data-p="home"><svg viewBox="0 0 16 16"><path d="M3 13.2V8.5M8 13.2V3M13 13.2V6"/></svg>Главная</button>
    <button class="ni" data-p="caps"><svg viewBox="0 0 16 16"><rect x="1.8" y="5.3" width="12.4" height="5.4" rx="2.7"/><circle cx="5" cy="8" r=".9" fill="currentColor" stroke="none"/></svg>Капсула</button>
    <button class="ni" data-p="text"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg>Текст</button>

    <button class="ni" data-p="key"><svg viewBox="0 0 16 16"><circle cx="5.3" cy="10.7" r="2.9"/><path d="m7.4 8.6 5.6-5.6M10.9 4.9l1.6 1.6M9.4 6.4l1.4 1.4"/></svg>Ключ Groq<i class="dot" id="keyDot" hidden></i></button>
    <button class="ni" data-p="about"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v3.6M8 5h.01"/></svg>О программе<i class="dot blue" id="updDot" hidden></i></button>
    <div class="nsp"></div>
    <div class="nfoot" id="nfoot"></div>
  </nav>
  <div class="main">
    <div class="pvw" id="pvw"><div class="pv" id="pv"></div></div>
    <div class="scroll" id="scroll">
      <section class="page" id="p-home"></section>
      <section class="page" id="p-caps"></section>
      <section class="page" id="p-text"></section>
      <section class="page" id="p-ctl"></section>
      <section class="page" id="p-key"></section>
      <section class="page" id="p-about"></section>

  </div>
</div>
