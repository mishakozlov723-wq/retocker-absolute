name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VER: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a ci.log
          node scripts/prepare.mjs "$VER" 2>&1 | tee -a ci.log
          npx tauri icon app-icon.svg -o src-tauri/icons 2>&1 | tail -3 | tee -a ci.log

      - name: Test filler cleanup
        run: |
          node scripts/test-fillers.mjs
          node scripts/test-target-cleanup.mjs
          node scripts/test-usage.mjs

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --no-bundle 2>&1 | tee -a ci.log
          ls -la src-tauri/target/release/*.exe | tee -a ci.log

      - name: Smoke test
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Local speech model check
        id: asr
        continue-on-error: true
        shell: pwsh
        run: |
          $env:RA_DEBUG = '1'
          $exe = (Resolve-Path "src-tauri/target/release/retocker-voice.exe").Path
          $p = Start-Process $exe -ArgumentList '--asr-selftest', "$PWD\asr.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); "timeout" | Add-Content asr.txt }
          Get-Content asr.txt -ErrorAction SilentlyContinue
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Install, update, uninstall check
        id: upgrade
        continue-on-error: true
        shell: pwsh
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: ./scripts/setup-check.ps1

      - name: Screenshots to the ci-shots branch
        if: always() && steps.smoke.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p out && cp -r shots smoke.txt upgrade.txt asr.txt out/ 2>/dev/null || true
          git checkout --orphan ci-shots
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -q -m "run ${{ github.run_number }}"
          git push -q -f origin ci-shots

      - name: Release
        if: contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: |
          set -o pipefail
          # one exe: named «…Setup…» it installs itself, any other name runs as the program (portable)
          cp src-tauri/target/release/retocker-voice.exe Retocker-Voice-Setup.exe
          cp src-tauri/target/release/retocker-voice.exe Retocker-Voice-portable.exe
          node scripts/sign.mjs Retocker-Voice-Setup.exe "$VER" "" latest.json
          cat latest.json | tee -a ci.log
          gh release create "v$VER" Retocker-Voice-Setup.exe Retocker-Voice-portable.exe latest.json \
            --title "Retocker Voice $VER" --notes-file RELEASE.md 2>&1 | tee -a ci.log

      # The app looks for updates in the public repository (this one is private). The same three files go there;
      # gh publishes the release only after the files are uploaded, so «latest» never points at an empty one.
      - name: Publish for everyone
        if: contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::The DOWNLOAD_TOKEN secret is not set: v$VER was not copied to retocker-absolute-download, so the app will not see this update."
            exit 0
          fi
          gh release create "v$VER" Retocker-Voice-Setup.exe Retocker-Voice-portable.exe latest.json \
            --repo mishakozlov723-wq/retocker-absolute-download --latest \
            --title "Retocker Voice $VER" --notes-file RELEASE.md 2>&1 | tee -a ci.log

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: retocker-voice-${{ env.VER }}
          path: src-tauri/target/release/retocker-voice.exe
          retention-days: 14

      - name: Report a failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run ${{ github.run_number }} (${GITHUB_SHA::7}) failed. Last lines of the log:"; echo; echo '```'; tail -c 60000 ci.log 2>/dev/null | grep -v '^\s*Compiling ' | tail -n 400; echo '```'; } > issue.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file issue.md
