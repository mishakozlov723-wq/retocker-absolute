name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      VER: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a ci.log
          node scripts/prepare.mjs "$VER" 2>&1 | tee -a ci.log
          npx tauri icon app-icon.svg -o src-tauri/icons 2>&1 | tail -3 | tee -a ci.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles nsis 2>&1 | tee -a ci.log
          ls -la src-tauri/target/release/bundle/nsis | tee -a ci.log

      - name: Smoke test
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Upgrade check (the old Retocker Absolute gets replaced)
        id: upgrade
        continue-on-error: true
        shell: pwsh
        run: |
          $log = "upgrade.txt"
          $old = Join-Path $env:RUNNER_TEMP "old-setup.exe"
          Invoke-WebRequest "https://github.com/mishakozlov723-wq/retocker-absolute-download/releases/download/v1.0.14/Retocker-Absolute-Setup.exe" -OutFile $old
          Start-Process $old -ArgumentList '/S' -Wait
          $od = (Get-ItemProperty 'HKCU:\Software\Retocker\Retocker Absolute' -ErrorAction SilentlyContinue).'(default)'
          "old installed at: $od; exe: $(Test-Path "$od\retocker-absolute.exe")" | Tee-Object -FilePath $log -Append
          New-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Retocker Absolute' -Value "`"$od\retocker-absolute.exe`" --autostart" -Force | Out-Null
          Start-Process "$od\retocker-absolute.exe" -ArgumentList '--autostart'
          Start-Sleep 5
          "old running before: $([bool](Get-Process retocker-absolute -ErrorAction SilentlyContinue))" | Tee-Object -FilePath $log -Append
          $new = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          Start-Process $new -ArgumentList '/S' -Wait
          Start-Sleep 2
          $nd = (Get-ItemProperty 'HKCU:\Software\Retocker\Retocker Voice' -ErrorAction SilentlyContinue).'(default)'
          "old exe left: $(Test-Path "$od\retocker-absolute.exe"); old folder left: $(Test-Path $od); old key left: $(Test-Path 'HKCU:\Software\Retocker\Retocker Absolute')" | Tee-Object -FilePath $log -Append
          "old running after: $([bool](Get-Process retocker-absolute -ErrorAction SilentlyContinue))" | Tee-Object -FilePath $log -Append
          "new installed at: $nd; exe: $(Test-Path "$nd\retocker-voice.exe")" | Tee-Object -FilePath $log -Append
          "start menu: $((Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Retocker" -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')" | Tee-Object -FilePath $log -Append
          Start-Process "$nd\retocker-voice.exe" -ArgumentList '--autostart'
          Start-Sleep 6
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          "autostart old: $($run.'Retocker Absolute'); new: $($run.'Retocker Voice')" | Tee-Object -FilePath $log -Append
          "new running: $([bool](Get-Process retocker-voice -ErrorAction SilentlyContinue))" | Tee-Object -FilePath $log -Append
          Get-Process retocker-voice, retocker-absolute -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Screenshots to the ci-shots branch
        if: always() && steps.smoke.outcome != 'skipped'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p out && cp -r shots smoke.txt upgrade.txt out/ 2>/dev/null || true
          git checkout --orphan ci-shots
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -q -m "run ${{ github.run_number }}"
          git push -q -f origin ci-shots

      - name: Release
        if: contains(github.event.head_commit.message, '[release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Retocker-Voice-Setup.exe
          cp src-tauri/target/release/retocker-voice.exe Retocker-Voice-portable.exe
          gh release create "v$VER" Retocker-Voice-Setup.exe Retocker-Voice-portable.exe \
            --title "Retocker Voice $VER" --notes-file RELEASE.md 2>&1 | tee -a ci.log

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: retocker-voice-${{ env.VER }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/retocker-voice.exe
          retention-days: 14

      - name: Report a failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Run ${{ github.run_number }} (${GITHUB_SHA::7}) failed. Last lines of the log:"; echo; echo '```'; tail -c 60000 ci.log 2>/dev/null | grep -v '^\s*Compiling ' | tail -n 400; echo '```'; } > issue.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file issue.md
