[package]
name = "retocker-voice"
version = "1.0.0"
edition = "2021"
description = "Retocker Voice"
authors = ["Retocker"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the local speech model: its engine (a DLL downloaded with the model) is loaded at run time
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
# updates: plain HTTPS through Windows' own TLS (no OpenSSL / ring), SHA-256 and an Ed25519 signature check
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
